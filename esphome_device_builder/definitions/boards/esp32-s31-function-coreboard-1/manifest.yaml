id: esp32-s31-function-coreboard-1
name: ESP32-S31-Function-CoreBoard-1
description: Espressif ESP32-S31 development board with the ESP32-S31-WROOM-3 module (16 MB flash, 16 MB PSRAM). Wi-Fi 6,
  Bluetooth Classic and LE, IEEE 802.15.4, Gigabit Ethernet (YT8531), USB 2.0 OTG High-Speed host port, ES8311 audio
  codec with onboard microphone and NS4150B speaker amplifier, addressable RGB LED.
manufacturer: Espressif
esphome:
  platform: esp32
  board: esp32-s31-function-coreboard-1
  variant: esp32s31
  framework: esp-idf
  logger_hardware_uart: USB_SERIAL_JTAG
hardware:
  flash_size: 16MB
  cpu_frequency: 320MHz
  connectivity:
  - wifi
  - bluetooth
  - ethernet
  - thread
  - zigbee
tags:
- dev-kit
- usb-c
- microphone
docs_url: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-function-coreboard-1/user_guide.html
featured_components:
- id: module_psram
  component_id: psram
  fields:
    mode:
      value: octal
      locked: true
    speed: 250MHZ

- id: onboard_ethernet
  component_id: ethernet
  name: Onboard Ethernet
  description: Built-in YT8531 Gigabit Ethernet PHY (RGMII).
  fields:
    type:
      value: YT8531
      locked: true
    mdc_pin:
      value: GPIO5
      locked: true
    mdio_pin:
      value: GPIO6
      locked: true
    power_pin:
      value: GPIO7
      locked: true
    phy_addr:
      value: 0
      locked: true

- id: onboard_rgb_led
  name: Onboard RGB LED
  component_id: light.esp32_rmt_led_strip
  fields:
    id: onboard_rgb_led
    name: Onboard RGB LED
    pin:
      value:
        number: GPIO60
        ignore_strapping_warning: true
      locked: true
    num_leds:
      value: 1
      locked: true
    chipset:
      value: WS2812
      locked: true
    channel_colors:
      value: GRB
      locked: true

- id: boot_button
  name: BOOT Button
  component_id: binary_sensor.gpio
  fields:
    name: BOOT Button
    pin:
      value:
        number: GPIO61
        inverted: true
        mode:
          input: true
          pullup: true
        ignore_strapping_warning: true
      locked: true
    id: boot_button

- id: i2c_bus
  name: Onboard I²C bus
  description: I²C bus of the ES8311 audio codec.
  component_id: i2c
  fields:
    id:
      value: i2c_bus
      locked: true
    sda:
      value: GPIO51
      locked: true
    scl:
      value: GPIO50
      locked: true
    frequency: 400kHz

- id: audio_bus
  component_id: i2s_audio
  fields:
    id:
      value: audio_bus
      locked: true
    i2s_mclk_pin:
      value: GPIO52
      locked: true
    i2s_bclk_pin:
      value: GPIO53
      locked: true
    i2s_lrclk_pin:
      value: GPIO55
      locked: true

- id: es8311_dac
  component_id: audio_dac.es8311
  fields:
    id:
      value: es8311_dac
      locked: true
    use_mclk:
      value: true
      locked: true
    use_microphone:
      value: false
      locked: true
    address:
      value: 0x18
      locked: true
    i2c_id:
      value: i2c_bus
      locked: true
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [i2c_bus]

- id: audio_output
  component_id: speaker.i2s_audio
  fields:
    id: audio_output
    i2s_audio_id:
      value: audio_bus
      locked: true
    i2s_dout_pin:
      value: GPIO56
      locked: true
    audio_dac:
      value: es8311_dac
      locked: true
    dac_type:
      value: external
      locked: true
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [audio_bus, es8311_dac]

- id: audio_input
  component_id: microphone.i2s_audio
  fields:
    id: audio_input
    adc_type:
      value: external
      locked: true
    i2s_audio_id:
      value: audio_bus
      locked: true
    i2s_din_pin:
      value: GPIO54
      locked: true
    pdm:
      value: false
      locked: true
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [audio_bus, es8311_dac]

- id: audio_amplifier
  name: Audio Amplifier Switch
  component_id: switch.gpio
  fields:
    name: Audio Amplifier
    id: audio_amplifier
    icon: mdi:volume-high
    restore_mode: ALWAYS_ON
    pin:
      value: GPIO57
      locked: true

default_components:
- module_psram

featured_bundles:
- id: audio_setup
  name: Audio Input/Output (full setup)
  description: ES8311 codec with the onboard microphone and the speaker port, plus a switch for the NS4150B amplifier.
  component_ids:
  - i2c_bus
  - audio_bus
  - es8311_dac
  - audio_output
  - audio_input
  - audio_amplifier

